name: Update RRG data

on:
  schedule:
    # Ogni giorno alle 22:30 UTC (~dopo la chiusura USA). Cron in UTC.
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch prezzi da Yahoo Finance
        run: node scripts/fetch_data.js

      - name: Commit dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "Nessuna variazione nei dati."
          else
            git commit -m "chore: aggiornamento dati prezzi $(date -u +%F)"
            git push
          fi
